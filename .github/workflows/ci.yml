name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: npm run format:check

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Verify the packaged artifact
        run: npm run verify:package

  # Runs the CLI, not `npm test`: the suite's mock.module() cannot run on the
  # floor. See CONTRIBUTING.md.
  oldest-supported-node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read the floor from engines.node
        id: engines
        run: node -p "'version=' + require('./package.json').engines.node.replace(/[^0-9.]/g, '')" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ steps.engines.outputs.version }}

      - name: Install dependencies
        run: npm ci

      - name: Verify the packaged artifact
        run: npm run verify:package

      # Fails if checkNodeVersion() and engines.node ever disagree.
      - name: The version gate accepts this version
        run: |
          npm run build
          node --input-type=module -e "import { checkNodeVersion } from './dist/ui/shared.js'; checkNodeVersion();"
