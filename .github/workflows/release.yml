name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release commit, tag and GitHub Release
      pull-requests: write # open and update the release PR
      actions: write # dispatch publish.yml once a release exists
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A GitHub Release created with GITHUB_TOKEN does not fire
      # `release: published` — GitHub suppresses those events so automation
      # cannot trigger itself recursively. workflow_dispatch is one of the two
      # documented exceptions, so this is how the publish actually starts.
      #
      # The publish stays in publish.yml rather than moving in here on purpose:
      # npm trusted publishing matches on the workflow *filename*, and for a
      # reusable workflow it matches the calling workflow, which would mean
      # reconfiguring the trusted publisher on npmjs.com. A dispatch keeps
      # publish.yml as the top-level workflow, so the existing config holds.
      - name: Dispatch the publish workflow
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run publish.yml --repo "$REPO" --ref "$TAG" --field tag="$TAG"
