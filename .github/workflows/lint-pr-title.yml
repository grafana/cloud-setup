name: Lint PR title

# Squash merging is how changes land here, and the repo is configured to use the
# PR title as the commit subject (squash_merge_commit_title: PR_TITLE) with an
# empty body. So the PR title *is* the commit message release-please will read,
# and this is the only place it can be checked before it becomes history.
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # commitlint.config.js has to be on disk for config-path to resolve, and
      # its `extends` resolves from this repo's node_modules.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Lint PR title
        uses: grafana/shared-workflows/actions/lint-pr-title@70c40e5b6522c854a55334124545261cae3d4c73 # lint-pr-title/v1.2.4
        with:
          config-path: "${{ github.workspace }}/commitlint.config.js"
